name: Trip reminders

# Once a day at 09:00 IST: asks the staging backend to send the trip reminders due today ("in 3 days", "tomorrow").
# Cloud Run gives the backend CPU only while it handles a request, so a timer inside it can't be relied on. The call
# is public and only sends what is due, once (NotificationController), so a retry or an extra run sends nothing more.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.API_BASE_URL != ''
    steps:
      - name: Send today's trip reminders
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # The first call may wait for a cold start. -d '' sends Content-Length: 0 (Google's front end refuses a POST
          # without it: 411).
          for attempt in 1 2 3; do
            if curl -sS -f --max-time 60 -X POST -d '' "${API_BASE_URL%/}/api/notifications/reminders"; then
              echo; exit 0
            fi
            echo "Attempt $attempt failed, retrying"; sleep 20
          done
          exit 1
