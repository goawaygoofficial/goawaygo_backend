spring.application.name=backend

# Local development: settings and passwords come from backend/.env (gitignored, see .env.example).
# Deployed environments set the same keys as environment variables, which take precedence.
spring.config.import=optional:file:.env[.properties]

# Port to listen on. Cloud Run sets PORT; locally it's 8080.
server.port=${PORT:8080}

# Behind Cloud Run's front end the connection comes from Google's proxy, which appends the real client address to
# X-Forwarded-For. "native" makes Tomcat trust that header only from internal proxy addresses, so rate limits apply
# to the real client and a client-supplied header can't fake it. Locally (no proxy) leave it at "none".
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Runtime connection uses the least-privilege app role (read/write data, no schema changes).
# TLS: "prefer" locally (the dev container has no TLS); deployed databases set DB_SSL_MODE=verify-full, which
# also checks the server certificate against Java's trusted CAs.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:goaway}?sslmode=${DB_SSL_MODE:prefer}&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
# Small pool: one instance and a small database. Hosted Postgres tiers cap connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Close connections after 2 idle minutes and keep none open when quiet: Neon only sleeps (and stays inside its free
# compute hours) when no connection is open, even while the backend itself stays up between uptime checks.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.username=${DB_APP_USER:goaway_app}
spring.datasource.password=${DB_APP_PASSWORD}

# Migrations (src/main/resources/db/migration) run as the schema owner role
spring.flyway.user=${DB_OWNER_USER:goaway_owner}
spring.flyway.password=${DB_OWNER_PASSWORD}

# JPA: Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Authentication: short-lived JWT access tokens + rotating refresh tokens (stored hashed)
goaway.auth.issuer=goaway-backend
goaway.auth.audience=goaway-api
goaway.auth.access-token-ttl=20m
goaway.auth.refresh-token-ttl=30d
# ES256 signing key pair, base64-encoded DER (PKCS#8 private, X.509 public). Required; see .env.example.
goaway.auth.jwt.private-key=${JWT_PRIVATE_KEY}
goaway.auth.jwt.public-key=${JWT_PUBLIC_KEY}
# Web clients get the refresh token in this cookie (HttpOnly, never readable by JavaScript)
goaway.auth.refresh-cookie.name=goaway_refresh
goaway.auth.refresh-cookie.path=/api/auth
goaway.auth.refresh-cookie.same-site=Strict
goaway.auth.refresh-cookie.secure=${AUTH_COOKIE_SECURE:true}

# Browser origins allowed to call the API (comma-separated)
goaway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Google Sign-In: ID tokens are verified against Google's public keys. Accepted audiences are our own
# OAuth client IDs (public identifiers, project goaway-483709): Web (website + mobile serverClientId), iOS.
goaway.auth.google.client-ids=${GOOGLE_CLIENT_IDS:1018541563002-sft2jld5f3n6lnenvt0pk8hknk7hfq9n.apps.googleusercontent.com,1018541563002-ss0dur7e8d4l9c2lb2o89edgouqrd2fv.apps.googleusercontent.com}
goaway.auth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
goaway.auth.google.issuers=https://accounts.google.com,accounts.google.com
# Authorization-code flow (the website's custom Google button): the backend swaps Google's one-time code for an
# ID token. Needs the Web client's secret (backend/.env only, never committed); without it that endpoint is off.
goaway.auth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:1018541563002-sft2jld5f3n6lnenvt0pk8hknk7hfq9n.apps.googleusercontent.com}
goaway.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
goaway.auth.google.token-uri=https://oauth2.googleapis.com/token

# Rate limiting (per client IP, and per email where an account is targeted). Exceeding a limit -> 429 with
# Retry-After. In-memory, so per backend instance; move to a shared store when running several instances.
# The client IP comes from server.forward-headers-strategy (above) behind a proxy.
goaway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
goaway.rate-limit.signin-per-ip.capacity=10
goaway.rate-limit.signin-per-ip.period=1m
goaway.rate-limit.signin-per-email.capacity=10
goaway.rate-limit.signin-per-email.period=15m
goaway.rate-limit.signup-per-ip.capacity=10
goaway.rate-limit.signup-per-ip.period=1h
goaway.rate-limit.google-signin-per-ip.capacity=20
goaway.rate-limit.google-signin-per-ip.period=1m
goaway.rate-limit.refresh-per-ip.capacity=60
goaway.rate-limit.refresh-per-ip.period=1m
goaway.rate-limit.forgot-password-per-ip.capacity=5
goaway.rate-limit.forgot-password-per-ip.period=1h
goaway.rate-limit.forgot-password-per-email.capacity=3
goaway.rate-limit.forgot-password-per-email.period=1h

# Email over SMTP. Defaults point at Mailpit (docker compose), which catches all mail locally.
# Resend (production): MAIL_HOST=smtp.resend.com MAIL_PORT=587 MAIL_USERNAME=resend MAIL_PASSWORD=<API key>
#   MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true MAIL_FROM="GoAwayGo <no-reply@your-domain>"
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
goaway.mail.from=${MAIL_FROM:GoAwayGo <no-reply@goaway.local>}
# Emails are sent right after the transaction commits, still inside the request: Cloud Run bills (and gives CPU)
# only while a request is handled. true = background thread, for hosts that keep CPU after the response.
goaway.mail.async=false

# Website that the emailed links open (reset password, verify email)
goaway.web.base-url=${WEB_BASE_URL:http://localhost:5173}

# Emailed links: single-use, stored as SHA-256 hashes
goaway.auth.password-reset-ttl=30m
# Forgot-password always takes at least this long, so the time doesn't reveal whether an email was sent (i.e.
# whether the account exists). Longer than a normal SMTP send.
goaway.auth.forgot-password-min-response=1500ms
goaway.auth.email-verification-ttl=24h
goaway.rate-limit.verification-email-per-user.capacity=3
goaway.rate-limit.verification-email-per-user.period=1h
goaway.rate-limit.token-redeem-per-ip.capacity=20
goaway.rate-limit.token-redeem-per-ip.period=1m

# Error tracking (Sentry). Off when SENTRY_DSN is empty (local, tests). Deployed environments set SENTRY_DSN,
# SENTRY_ENVIRONMENT and SENTRY_RELEASE. No personal data: no IPs, cookies, headers or request bodies are sent.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.send-default-pii=false
sentry.max-request-body-size=none
sentry.in-app-includes=com.goaway.backend
# 10% of requests traced: enough to spot slow endpoints, well inside the free span allowance.
sentry.traces-sample-rate=0.1
# ERROR log lines (e.g. GlobalExceptionHandler's "Unhandled exception") become Sentry issues; INFO+ are breadcrumbs.
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info

# Logs. Locally: human-readable. Deployed: one JSON object per line that Google Cloud Logging understands
# (LOGGING_STRUCTURED_FORMAT_CONSOLE=com.goaway.backend.logging.CloudLoggingFormatter). Every line logged while
# handling a request carries its requestId, also returned to the client as the X-Request-Id header.

# Health endpoint for uptime monitoring: GET /actuator/health -> {"status":"UP"}. Liveness only: it doesn't touch the
# database (a check every few minutes would keep Neon awake and use up its free hours) or the mail server; their
# failures show up in Sentry instead. Nothing else from Actuator is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.health.db.enabled=false
management.health.mail.enabled=false

# Outside APIs (com.goaway.backend.external, docs/deployment.md "Outside APIs"). One block per provider, added with
# the feature that uses it. Limits go below the provider's free tier; the key comes from Secret Manager
# (GOAWAY_EXTERNAL_PROVIDERS_<NAME>_APIKEY), never from this file. Example:
#   goaway.external.providers.opentripmap.base-url=https://api.opentripmap.com/0.1
#   goaway.external.providers.opentripmap.daily-limit=4500
#   goaway.external.providers.opentripmap.cache-ttl=7d
