spring.application.name=backend

# Local development: settings and passwords come from backend/.env (gitignored, see .env.example).
# Deployed environments set the same keys as environment variables, which take precedence.
spring.config.import=optional:file:.env[.properties]

# Runtime connection uses the least-privilege app role (read/write data, no schema changes)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:goaway}
spring.datasource.username=${DB_APP_USER:goaway_app}
spring.datasource.password=${DB_APP_PASSWORD}

# Migrations (src/main/resources/db/migration) run as the schema owner role
spring.flyway.user=${DB_OWNER_USER:goaway_owner}
spring.flyway.password=${DB_OWNER_PASSWORD}
